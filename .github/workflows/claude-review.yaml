name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time. New pushes cancel the in-flight run so you
# get a single review of the final state instead of three overlapping ones.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip PRs from forks. On a public repo GitHub withholds secrets from
    # fork-triggered runs, so this job would start a runner and then fail.
    # Fork PRs get no automatic review — review those manually.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --append-system-prompt "This session is non-interactive and ends as soon as you stop calling tools. Always run subagents in the foreground (run_in_background: false) and never end your turn to wait for one. Finish the whole review before stopping. If the review finds no major issues (nothing that should block merging), post a PR comment saying LGTM with `gh pr comment`, so the author can tell the review ran and the PR is good to merge. Minor nits do not block LGTM. If there are major issues, post those findings instead and do not say LGTM. Never finish silently."
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh search:*)"
