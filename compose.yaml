services:
  backend:
    build: ./backend
    environment:
      - GIN_MODE=debug
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD', '/server', '--health']
      interval: 10s
      retries: 3
    networks:
      - halfbuilt

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      - API_URL=http://backend:8080
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./frontend:/app # hot reload
      - /app/node_modules # keep the container's node_modules
    networks:
      - halfbuilt

networks:
  halfbuilt:
