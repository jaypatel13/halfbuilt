services:
  backend:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      - GIN_MODE=release
    healthcheck:
      test: ['CMD', '/server', '--health'] # see note below
      interval: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app # hot reload
      - /app/node_modules # keep the container's node_modules
